[package]
name = "power-ring"
version = "0.2.6"
edition = "2021"
description = "Windows 无线外设电量监测工具（托盘电量环）"
license = "MIT"
repository = "https://github.com/vkeyzhen/PowerRing"

[[bin]]
name = "powerring"
path = "src/main.rs"

[build-dependencies]
# 把图标和版本信息写进 exe。手写 .rc 也行，但资源编译器怎么调、路径怎么传
# 在不同环境下容易出岔子，这个库就是专门抹平这些差异的
embed-resource = "3"

[dependencies]
hidapi = "2"
tray-icon = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # M2：开机自启（写 HKCU Run 键）+ 单实例保护（命名互斥量）
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    # M2：深色主题下把窗口标题栏也变深（DWM 属性）
    "Win32_Graphics_Dwm",
    # M3：蓝牙设备读标准 Battery Service（0x180F / 0x2A19）
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Storage_Streams",
    # 设备信息导出：把报表写进剪贴板（CF_UNICODETEXT + 全局内存）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # 声明同步：拉远程设备清单（系统自带，不引 HTTP 依赖）
    "Win32_Networking_WinHttp",
]

# release 档：体积不再是最优目标，编译速度与可调试性优先
# 决策依据（2026-10-20）：本项目反馈循环慢才是最大成本，为省几 MB 换数倍编译时间不划算
[profile.release]
opt-level = "s"      # 体积与速度的平衡点，比 3 略小、比 "z" 快得多
lto = "thin"         # 增量友好的链接时优化，避免 fat LTO 拖慢每次构建
codegen-units = 16   # 保持并行编译
strip = true         # 剥离符号（几乎无代价，照做）
