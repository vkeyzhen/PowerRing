# 由 tools/build_remote.py 自动生成 —— 别手改，改了也会被下次生成覆盖。
# 要加设备：改 devices/ 下的声明文件，重新跑一次这个脚本，把结果一起提交。
#
# 这是托盘菜单里「检查设备声明更新…」要拉的那份清单：把 devices/ 里所有声明
# 打成一个文件，程序一次请求就能拿全。
# 注释在打包时被丢掉了：它们在仓库的 devices/*.yaml 里照样能读到，
# 而这份清单是给机器读的，多带几 KB 注释只是让同步白白变慢。
devices:
  - name: "凌豹 MK75"
    short: "MK75"
    protocol: "raw"
    transport: "direct"
    match:
      vendor_id: "0x3554"      # Compx
      product_id: "0xFA09"     # 2.4G Wireless Receiver
      usage_page: "0xFF02"
      usage: "0x0002"
    battery:
      request: "13 05"
      reply_len: 20
      reply_prefix: "13 0A 01 00 04 05"
      value_index: 6
      state_index: 7
      charging_mask: "0x10"
    protocol_source: "Compx 2.4G 接收器（3554:FA09）报文格式，参考 harshvats17/f75-linux-manager 与 oneday5799 的公开排障记录，并逐帧核对校验和"
    verification: "verified"
    notes: >
      报文结构是固定 20 字节：13 <命令/类型> <总页数> <页号> <载荷长度> <载荷…> <校验和>，
      校验和是前 20 字节里除末字节外全部相加取低 8 位。本文件里那两条报文都实测对得上。
      排查时踩过的坑，留给后来的人：
      1. 应答帧第二字节等于请求的命令号（0x42/0x43/0x44 都是这样），
         但 0x0A 不是命令而是**通知类型** —— 拿 0x0A 当命令去问，永远没有回应。
         真正的查询命令是 0x05。
      2. 一问会回两帧，只读一帧会读到状态帧里那个恒为 0 的字节。
      3. 0x05 的应答里有一个 0xC6 字节，不随电量变化（插线/拔线/电量 87→93 都不变），
         不要拿它当电量。
      **读数基准**：实测 87% 时，键盘自身的 Fn+B 电量灯亮到 F8（共 10 格），
      两者一致；充电中 89%→93% 一路递增，拔线立刻回到 0x01。这是目前唯一
      有外部基准可对照的一台 raw 设备（天箭没有），所以标 verified。
      已知限制：只能读到电量，读不到键盘的灯效、按键映射等配置项。
      配套驱动也不显示电量百分比，本声明是唯一能拿到数字的途径。

  - name: "HyperX Cloud Flight"
    short: "Cloud Flight"
    protocol: "raw"
    transport: "direct"
    match:
      vendor_id: "0x0951"      # Kingston / HyperX
      product_id: "0x1723"     # Cloud Flight 的无线接收器
      usage_page: "0xFF90"     # 只有这个 vendor collection 会回应电量请求
      usage: "0x0303"
    battery:
      request: "21 FF 05"
      reply_len: 20
      state_index: 3           # 档位字节：决定下面那张表用哪一组
      value_index: 4           # 数值字节
      charging_states: ["0x10", "0x11"]
      table:
        "0x0e":                # 数值 250..90，大致对应 65% ~ 10%
          - [89, 10]
          - [119, 15]
          - [148, 20]
          - [159, 25]
          - [169, 30]
          - [179, 35]
          - [189, 40]
          - [199, 45]
          - [209, 50]
          - [219, 55]
          - [239, 60]
          - [255, 65]
        "0x0f":                # 数值 130..0，大致对应 100% ~ 70%
          - [19, 70]
          - [49, 75]
          - [69, 80]
          - [99, 85]
          - [119, 90]
          - [129, 95]
          - [255, 100]
    protocol_source: "HyperX Cloud Flight 电量报文常量，参考 kondinskis/hyperx-cloud-flight（MIT）公开仓库"
    verification: "verified"
    notes: >
      接收器暴露 4 个接口，只有 usage_page 0xFF90 / usage 0x0303 会回应电量请求，
      其余三个（000C:0001 / FF00:0001 / FFC0:0001）发了也没反应 —— 探测时别只试一个。
      请求必须补齐到 20 字节（实测与罗技长报文一样对长度敏感）。
      耳机没开机时探测无响应，扫描会正确地把它排除，而不是显示 0%。
      实测读数：档位 0x0E、数值 231 → 60%。
      **这份声明没有外部基准可以对照**，写在这里免得后来人白找：
      HyperX 官方软件（NGENUITY）不显示具体百分比，看不到它读到的是什么，
      所以这里的 `verified` 只意味着「多次读数稳定一致、自洽」，
      不等于「与厂商读数是同一个数」。上面那张分段表来自 protocol_source
      里那个 MIT 仓库，并非本程序对着官方软件标定出来的，准许有偏差。
      谁手上有能显示精确百分比的官方或第三方读数，欢迎回来修这张表。

  - name: "Logitech G PRO Wireless"
    short: "GPW"
    protocol: "hid++2.0"
    transport: "receiver"
    match:
      vendor_id: "0x046D"
      product_id: "0xC539"   # Lightspeed 接收器的 PID，不是鼠标本身的
      usage_page: "0xFF00"   # 罗技 vendor collection
      usage: "0x0002"       # HID++ 2.0 长报文（20 字节）
    slots: [1, 2, 3, 4, 5, 6]
    battery:
      feature: "0x1001"
      kind: "voltage"
    identify:
      name_feature: "0x0005"
      contains: "PRO WIRELESS"
    protocol_source: "Logitech HID++ 2.0，常量参考 Solaar（GPL-3.0）公开文档"
    verification: "verified"
    notes: >
      接收器暴露 3 个 vendor collection：0x0001(短报文 7B) / 0x0002(长报文 20B) / 0x0004。
      长报文必须写满 20 字节，否则设备不响应或回错误码 0x8F。
      探测 slot 是否有设备要用 getFeature，不能用 ping。
      电压读数有约 1mV 抖动，代码侧做了滞回平滑（变化不足 2% 不更新）。
      与官方软件 G HUB 对照过两次，**偏差都在 1% 以内，但方向不一致**：
      高电量段 G HUB 92% 时本程序 93%（本程序偏高 1）；
      低电量段 3744 mV 读 28% 时 G HUB 显示 29%（本程序偏低 1）。
      方向会翻转，说明这不是一条可以整体挪一挪就消掉的偏差 ——
      它是两侧采样时刻不同、加上各自的插值与取整方式带来的 ±1% 抖动。
      真要严格核对：让鼠标静置几分钟（不移动、不掉电），两侧同时看同一个瞬间的值。

  - name: "Logitech G PRO Wireless"
    short: "GPW"
    protocol: "hid++2.0"
    transport: "direct"
    match:
      vendor_id: "0x046D"
      product_id: "0xC088"
      usage_page: "0xFF00"
      usage: "0x0002"       # 长报文接口（20 字节）
    battery:
      feature: "0x1001"     # 电压式，与无线时同一个 feature
      kind: "voltage"
    identify:
      name_feature: "0x0005"
      contains: "PRO WIRELESS"
    protocol_source: "Logitech HID++ 2.0，常量参考 Solaar（GPL-3.0）公开文档"
    verification: "verified"
    notes: >
      实测（插线充电中）：读到 4100 mV，flags = 0x80 表示正在充电。
      这份声明解决的是一个挺别扭的体验问题 —— **鼠标没电插上线的那一刻，托盘里
      它反而消失了**。接收器拔了，原来那条链路断了，而人恰恰是这时候最想知道
      「充到多少了」。有线模式走的是同一个 HID++ feature，补上这份声明就接住了。
      两个细节：
      1. 直连设备不挑 device index。实测 0x00 / 0x01 / 0x02 / 0x03 / 0xFF 全都
         有响应（会把请求里的 index 原样回显），这块和接收器模式要逐个 slot 试不一样。
      2. 充电标志位是 flags 的 bit7 —— 之前 GPW 一直在无线模式下、电量又总在中高位，
         没机会确认这位，这次是在真充电状态下第一次核对上的。
      会不会和接收器那份声明同时显示成两台 GPW？**不会，已验证**：
      两种都插着的情况下首轮只匹配到 1 台 —— 鼠标插线时工作在有线模式，接收器上那个
      slot 就是空的，接收器那份自然匹配不上。
      拔插的那几秒会读到失败，这是正常的：设备正在 USB 重枚举。 misses 机制会保留
      上次读数，动完的那轮就回来了。

  - name: "Xbox Wireless Controller"
    short: "Xbox 手柄"
    protocol: "ble"
    transport: "direct"
    match:
      vendor_id: "0x045E"
      product_id: "0x0B13"   # Series X|S 手柄的蓝牙模式；旧款 Xbox One S 手柄常见是 0x02FD
    battery:
      kind: "percent"        # 标准 Battery Level 读出来就是百分比，不用换算
    protocol_source: "蓝牙 SIG 公开标准：Battery Service 0x180F / Battery Level 0x2A19"
    verification: "verified"
    notes: >
      实测（本机蓝牙连接）：一个晚上连续读数 32% → 17% → 12% → 9% → 8%，
      手柄全程在用，一路掉到最后自动关机，读数符合预期。
      与 Windows 蓝牙设置里的百分比**交叉对照过两次，高低两端都一致**：
      低电量时设置页显示 12%，同一时刻读到的也是 12%；
      高电量时设置页 93%，读到的也是 93%。
      这不是巧合 —— 两者同源同值，读数 authority 都在系统那份蓝牙缓存里。
      值本身是准的、也够新 —— 程序每轮是**真的发一条 GATT 读请求到设备上**拿当下这个值
      （实测十几毫秒），不是等系统什么时候想起刷新。只有在那一瞬间读不到时，才会退回
      系统缓存里那份可能陈旧的值。
      设备不在了就会从列表里退下去：每次取值前先看蓝牙还连着没有，断连（关机、休眠、
      人走了）就不再算它是在线的，连回来自动出现。这一条是必需的 —— 系统会把已配对
      设备的最后读数长期留着，哪怕那台设备早就不在身边（本机有一台放在公司的键盘，
      长年能枚举到、能读出 100%），光看「读得到值」根本分不出它在不在。
      换连接方式就读不到了：USB 有线不走 GATT，Xbox 无线适配器走的是微软私有 GIP
      协议，只有蓝牙模式才暴露标准 Battery Service —— 所以这条声明只覆盖蓝牙连接。
      两条标准限制，写在这里免得后来人再找一遍：
      1. 标准 Battery Level 只有一个百分比字节，**没有「是否在充电」这一位**，
         所以这台设备在程序里永远不会显示为充电中。
      2. 因此也无法区分「电量低」和「手柄正在充电」，低电量提醒有可能在充电初期
         还在低位时弹一次（跨档才弹的机制保证不会重复弹）。
      设备名不是声明里写死的，用的是系统蓝牙配对里认到的那个名字。
