# 凌豹 MK75 机械键盘（2.4G 接收器）
#
# 这颗接收器不是凌豹独占的：Compx 的方案被 AULA（狼蛛）F75 / F99 Pro / X99 Pro
# 等一堆键盘共用，VID:PID 都是 3554:FA09。协议常量来自公开资料 + 本机实测，
# 来源见 protocol_source。本项目未复制任何源码。

name: "凌豹 MK75"
short: "MK75"

# raw = 原始报文，发什么、取哪个字节、怎么判断充电全部写在本文件里
protocol: "raw"
# 接收器已经把命令转发给键盘，不用按 slot 寻址
transport: "direct"

match:
  vendor_id: "0x3554"      # Compx
  product_id: "0xFA09"     # 2.4G Wireless Receiver
  # 这个接收器暴露 7 个接口，只有这一对会应答复位报文：
  # 键盘(0006)、鼠标(0002)、系统控制(0080)、多媒体(0001) 都是标准用法，
  # 剩下的 FF04 只回一条像灯效设置的定长特性报文
  usage_page: "0xFF02"
  usage: "0x0002"

battery:
  # 查询报文。实测必须按 20 字节发（短了设备不回），末尾补零即可
  request: "13 05"
  reply_len: 20
  # 一问会回来**两帧**：先是 13 05 的状态帧，再是 13 0A 的电量通知。
  # 两帧长度一样、内容完全不同，只读第一帧就会拿到一个恒为 0 的字节，
  # 界面永远显示 0%。用前缀把真正带电量那条挑出来
  reply_prefix: "13 0A 01 00 04 05"
  # 电量百分比就在这一位（实测 0x57 = 87%）
  value_index: 6
  # 第 7 字节是状态位：0x01 = 电池供电，0x10 = 正在充电
  state_index: 7
  # 按位判充电，而不是整字节相等 —— 充电时电量照常上报，
  # 这个位和电量是两个独立信息（充电中实测 89%→93% 一路涨）
  charging_mask: "0x10"

protocol_source: "Compx 2.4G 接收器（3554:FA09）报文格式，参考 harshvats17/f75-linux-manager 与 oneday5799 的公开排障记录，并逐帧核对校验和"
verification: "verified"

notes: >
  报文结构是固定 20 字节：13 <命令/类型> <总页数> <页号> <载荷长度> <载荷…> <校验和>，
  校验和是前 20 字节里除末字节外全部相加取低 8 位。本文件里那两条报文都实测对得上。

  排查时踩过的坑，留给后来的人：
  1. 应答帧第二字节等于请求的命令号（0x42/0x43/0x44 都是这样），
     但 0x0A 不是命令而是**通知类型** —— 拿 0x0A 当命令去问，永远没有回应。
     真正的查询命令是 0x05。
  2. 一问会回两帧，只读一帧会读到状态帧里那个恒为 0 的字节。
  3. 0x05 的应答里有一个 0xC6 字节，不随电量变化（插线/拔线/电量 87→93 都不变），
     不要拿它当电量。

  **读数基准**：实测 87% 时，键盘自身的 Fn+B 电量灯亮到 F8（共 10 格），
  两者一致；充电中 89%→93% 一路递增，拔线立刻回到 0x01。这是目前唯一
  有外部基准可对照的一台 raw 设备（天箭没有），所以标 verified。

  已知限制：只能读到电量，读不到键盘的灯效、按键映射等配置项。
  配套驱动也不显示电量百分比，本声明是唯一能拿到数字的途径。
